
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem em Tela Cheia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
        }
    </style>
</head>
<body>

    <img
        src="https://i.imgur.com/TLxj7Jn.png"
        alt="Imagem em tela cheia"
    >

</body>
</html>
